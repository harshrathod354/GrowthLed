<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GrowthLed for System Integrators</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#080c13;--ink2:#0e141d;--ln:#1c2633;--mint:#1f9bff;--md:#1f9bff;--red:#ff5a36;--or:#ff5a36;--gr:#2ee6a8;--paper:#0a0f17;--tx:#f2f2f2;--mu:#9a9a9a;--dm:#a3a3a3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--ink);color:var(--tx);font:400 17px/1.55 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;letter-spacing:-.025em}
.s{padding:110px 24px}.dk{background:var(--ink);color:#e6edf5}.lt{background:var(--paper);color:#e8e8e8}.mn{background:linear-gradient(120deg,#1f9bff,#2ee6a8);color:#04101a}
.w{max-width:1120px;margin:0 auto}.c{text-align:center}
h2{font-size:clamp(34px,5vw,60px);line-height:1.04;margin-bottom:14px}h2 em,.hero h1 em{font-style:normal;background:linear-gradient(90deg,#1f9bff,#2ee6a8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.sub{font-size:19px;color:var(--mu);max-width:30em;margin:0 0 56px}.dk .sub{color:var(--dm)}.c .sub{margin-left:auto;margin-right:auto}
.btn{display:inline-block;background:linear-gradient(90deg,#1f9bff,#2ee6a8);color:#000;font-weight:600;padding:15px 28px;border-radius:10px;text-decoration:none;transition:.2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.12)}.btn.o{background:none;color:#fff;border:1px solid #3a4f66}.btn.k{background:var(--ink);color:#fff}
a:focus-visible{outline:3px solid var(--red);outline-offset:3px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(8,12,19,.9);backdrop-filter:blur(10px);padding:12px 24px;border-bottom:1px solid var(--ln)}
nav .w{display:flex;justify-content:space-between;align-items:center}
.lg{font:700 21px 'Space Grotesk';color:#fff;text-decoration:none}.lg i{color:var(--mint);font-style:normal}nav .btn{padding:9px 20px;font-size:14px}
.ic{width:44px;height:44px;border-radius:10px;border:1px solid rgba(255,90,54,.35);background:rgba(255,90,54,.08);color:var(--or);display:grid;place-items:center;margin-bottom:18px}
.ic svg{width:22px;height:22px}
.g{display:grid;gap:18px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.t{border:1px solid var(--ln);border-radius:16px;padding:28px 24px;transition:.25s}.t:hover{border-color:var(--mint)}
.t h3{font-size:20px;margin-bottom:6px}.t p{margin:0;color:var(--mu);font-size:15px}
/* hero */
.hero{padding:80px 24px 70px}
.hg{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(44px,7vw,84px);line-height:.98;color:#fff;margin-bottom:24px}
.hero p{font-size:20px;color:var(--dm);max-width:25em;margin:0 0 32px}.bs{display:flex;gap:12px;flex-wrap:wrap}
.orb{width:100%;max-width:480px;margin:auto}.orb .ring{transform-origin:230px 230px;animation:sp 60s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:72px;border-top:1px solid var(--ln);padding-top:32px;text-align:center}
.stats b{display:block;font:700 clamp(32px,5vw,56px)/1 'Space Grotesk';color:#fff}.stats span{color:var(--dm);font-size:15px}
/* process */
.pr{display:grid;grid-template-columns:repeat(4,1fr);position:relative;margin-top:8px}
.pr:before{content:'';position:absolute;top:34px;left:12%;right:12%;border-top:1px dashed #444}
.pr div{text-align:center;padding:0 14px;position:relative}.pr .ic{margin:0 auto 18px;width:70px;height:70px;border-radius:50%;background:var(--ink);color:var(--or);box-shadow:0 0 0 8px var(--paper)}.pr .ic svg{width:30px;height:30px}
.pr h3{font-size:22px;margin-bottom:6px}.pr p{margin:0;color:var(--mu);font-size:15px}
/* offer */
.of{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:36px}
.of>div{border-radius:20px;padding:40px 28px;text-align:center}.of .a{box-shadow:inset 0 0 0 1px var(--ln)}.of .b{box-shadow:inset 0 0 0 1px var(--gr)}
.of .f{display:inline-block;padding:15px 30px;border-radius:10px;font-weight:600;margin-bottom:18px}.a .f{background:#1c1c1c;color:#777}.b .f{background:var(--gr);color:#000}
.of p{margin:0;color:var(--dm)}.b p{color:#d4f5df}.of small{display:block;font:500 12px Inter;letter-spacing:.1em;margin-bottom:18px;color:var(--dm)}.b small{color:var(--gr)}
.pl{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.pl span{border:1px solid #333;border-radius:99px;padding:8px 18px;font-size:14px;color:#ddd}
/* abm */
.ab{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.ab div{text-align:center}.ab .ic{margin:0 auto 12px;width:64px;height:64px;border-radius:50%}.ab b{display:block;font:600 16px 'Space Grotesk'}.ab span{font-size:13px;color:var(--mu)}
/* solutions */
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.sg .t{padding:22px 20px}.sg .ic{width:46px;height:46px;margin-bottom:14px}.sg h3{font-size:17px}.sg p{font-size:13px}
.tag{font:600 12px Inter;letter-spacing:.1em;color:var(--or);margin:36px 0 14px;display:block}.tag:first-of-type{margin-top:0}
/* measure */
.fz{display:grid;gap:6px;max-width:760px;margin:0 auto 64px}.fz div{height:50px;margin:0 auto;border-radius:10px;display:flex;align-items:center;justify-content:center;font:600 14px 'Space Grotesk';letter-spacing:.08em;background:#111;border:1px solid #2a2a2a;color:#ddd}
.fz div:last-child{background:var(--or);border-color:var(--or);color:#000}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:20px}.ba>div{padding:36px 32px;border-radius:20px;font:500 clamp(22px,2.8vw,32px)/1.25 'Space Grotesk'}
.ba small{display:block;font:600 12px Inter;letter-spacing:.12em;margin-bottom:12px}.ba .x{border:1px solid var(--ln);color:#777}.ba .x span{text-decoration:line-through;text-decoration-color:var(--red)}.ba .y{border:1px solid var(--gr);color:#fff}.ba .y small{color:var(--gr)}
/* cta */
.cta h2{font-size:clamp(38px,6vw,76px);max-width:11em;margin:0 auto 18px}.cta h2 em{background:none;-webkit-text-fill-color:currentColor;color:#04101a!important}.cta p{font-size:19px;max-width:30em;margin:0 auto 28px}
.cta .pl span{border-color:rgba(0,0,0,.4);color:#000;font-size:13px;padding:6px 14px}.cta .pl{margin-bottom:36px}
footer{background:var(--ink);color:var(--dm);padding:28px 24px;font-size:14px}footer .w{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}footer a{color:var(--mint)}
.rv{opacity:0;transform:translateY(26px);transition:.7s}.rv.in{opacity:1;transform:none}
.prob .ic{color:var(--or)}
@media(max-width:900px){.hg,.of,.ba{grid-template-columns:1fr}.g4,.sg{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}.pr{grid-template-columns:1fr 1fr;row-gap:36px}.pr:before{display:none}.ab{grid-template-columns:repeat(3,1fr);row-gap:24px}.s{padding:72px 20px}.hero{padding-top:48px}.orb{max-width:340px}}
@media(max-width:520px){.g4,.g3,.g2,.sg{grid-template-columns:1fr}.fz div{font-size:12px}}
.ct{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}.ct .pl{justify-content:flex-start;margin-bottom:28px}.ct .sub{margin-left:0}.ct p.em{color:var(--dm);font-size:15px}.ct p.em a{color:#6cc0ff}
.cf{border:1px solid var(--ln);border-radius:20px;padding:32px;background:var(--ink2);display:grid;gap:16px}.cf label{display:grid;gap:6px;font-size:13px;font-weight:500;color:var(--dm)}
.cf input,.cf select,.cf textarea{font:400 16px Inter,sans-serif;background:var(--ink);color:#fff;border:1px solid var(--ln);border-radius:10px;padding:12px 14px;width:100%}
.cf input:focus,.cf select:focus,.cf textarea:focus{outline:none;border-color:var(--mint)}.cf .r2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.cf .btn{border:0;cursor:pointer;font:600 16px Inter,sans-serif;color:#04101a}.cf .ok{margin:0;font-size:14px;color:var(--gr)}
@media(max-width:900px){.ct,.cf .r2{grid-template-columns:1fr}.ct{gap:36px}}
@media(prefers-reduced-motion:reduce){.orb .ring{animation:none}.rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
</style></head><body>
<nav><div class="w"><a class="lg" href="#top">Growth<i>Led</i></a><a class="btn" href="#book">Book a strategy call</a></div></nav>
<main id="app"></main>
<footer><div class="w"><span>© 2026 GrowthLed. All rights reserved.</span><span><a href="mailto:hello@growthled.in">hello@growthled.in</a> · Ahmedabad, India · 8+ countries</span></div></footer>
<script>
const P={cctv:'M3 8h12v6H3z M15 10l5-2v6l-5-2 M7 14v4 M5 18h6',lock:'M6 11h12v9H6z M8 11V8a4 4 0 018 0v3',eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z M12 9a3 3 0 100 6 3 3 0 000-6',fire:'M12 3c1 4 5 5 5 10a5 5 0 01-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z',net:'M12 3a2 2 0 100 .01 M5 19a2 2 0 100 .01 M19 19a2 2 0 100 .01 M12 5v6 M12 11l-6 6 M12 11l6 6',srv:'M4 5h16v5H4z M4 14h16v5H4z M7 7.5h.01 M7 16.5h.01',cloud:'M7 18a4 4 0 010-8 5 5 0 019.5 1A3.5 3.5 0 0116.5 18z',shield:'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z M9 12l2 2 4-4',scr:'M3 5h18v11H3z M8 20h8 M12 16v4',bld:'M5 21V4h9v17 M14 9h5v12 M8 8h2 M8 12h2 M8 16h2 M3 21h18',tel:'M7 3h10v18H7z M11 18h2',cog:'M12 8a4 4 0 100 8 4 4 0 000-8z M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 5l2 2 M17 17l2 2 M5 19l2-2 M17 7l2-2',tgt:'M12 3a9 9 0 100 18 9 9 0 000-18z M12 7a5 5 0 100 10 5 5 0 000-10z M12 12h.01',usr:'M9 11a3 3 0 100-6 3 3 0 000 6z M3 20c0-3.5 3-6 6-6s6 2.5 6 6 M17 8a2.5 2.5 0 110 5 M21 19c0-2-1.5-4-4-4.5',chart:'M4 20V4 M4 20h16 M8 16l4-5 3 3 5-7',fun:'M3 4h18l-7 8v7l-4 2v-9z',mega:'M3 10v4h4l8 4V6L7 10z M18 9a4 4 0 010 6',lay:'M12 3l9 5-9 5-9-5z M3 13l9 5 9-5',link:'M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1 M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1',clk:'M12 3a9 9 0 100 18 9 9 0 000-18z M12 7v5l3 2',usd:'M12 3v18 M16 7c-1-1.5-8-2-8 1.5S16 12 16 15.5 9 20 8 17',cart:'M3 4h3l2 12h11l2-8H7 M10 20h.01 M18 20h.01',cap:'M2 9l10-5 10 5-10 5z M6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5',plus:'M9 3h6v6h6v6h-6v6H9v-6H3V9h6z',fac:'M3 21V9l6 4V9l6 4V5h6v16z',bank:'M3 9l9-5 9 5 M5 10v8 M10 10v8 M14 10v8 M19 10v8 M3 21h18',bag:'M4 8h16v12H4z M9 8V5h6v3',srch:'M11 4a7 7 0 100 14 7 7 0 000-14z M16 16l5 5',map:'M12 21s7-6 7-11a7 7 0 10-14 0c0 5 7 11 7 11z M12 7.5a2.5 2.5 0 100 5 2.5 2.5 0 000-5z',off:'M3 3l18 18 M10 5a7 7 0 018 8 M6 7a7 7 0 00-1 5'};
const I=(n,x='')=>`<svg ${x} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${P[n].split(' M').map((d,i)=>`<path d="${i?'M':''}${d}"/>`).join('')}</svg>`;
const S=(c,i,id='')=>`<section class="s ${c}" ${id?`id="${id}"`:''}><div class="w">${i}</div></section>`;
const tile=(n,t,p)=>`<div class="t rv"><div class="ic">${I(n)}</div><h3>${t}</h3><p>${p}</p></div>`;
const pills=a=>`<div class="pl">`+a.split('|').map(x=>`<span>${x}</span>`).join('')+`</div>`;
// orbit
let o=`<svg class="orb" viewBox="0 0 460 460" role="img" aria-label="Six technology solutions feeding one pipeline"><defs><radialGradient id="cg"><stop offset="0" stop-color="#ff7a55"/><stop offset="1" stop-color="#ff5a36"/></radialGradient></defs><circle class="ring" cx="230" cy="230" r="170" fill="none" stroke="#444" stroke-dasharray="3 9" stroke-width="2"/>`;
[['cctv','CCTV'],['lock','Access'],['net','Network'],['shield','Cyber'],['scr','AV'],['bld','BMS']].forEach(([n,l],i)=>{const a=(-90+i*60)*Math.PI/180,x=230+170*Math.cos(a),y=230+170*Math.sin(a);
o+=`<line x1="230" y1="230" x2="${x}" y2="${y}" stroke="#2a2a2a" stroke-width="2"/><circle cx="${x}" cy="${y}" r="36" fill="#000" stroke="#1f9bff" stroke-width="1.5"/><g color="#1f9bff">${I(n,`x="${x-14}" y="${y-18}" width="28" height="28"`)}</g><text x="${x}" y="${y+27}" text-anchor="middle" fill="#a3a3a3" font-size="11" font-family="Inter">${l}</text>`});
o+=`<circle cx="230" cy="230" r="74" fill="url(#cg)"/><text x="230" y="226" text-anchor="middle" font-family="Space Grotesk" font-weight="700" font-size="20" fill="#000">PIPELINE</text><text x="230" y="250" text-anchor="middle" font-family="Space Grotesk" font-weight="600" font-size="14" fill="#000">→ REVENUE</text></svg>`;
let h=`<header id="top" class="hero"><div class="w"><div class="hg"><div><h1>Win the projects. <em>Not just leads.</em></h1><p>Marketing for CCTV, access control, networking, cybersecurity, AV and BMS integrators, measured all the way to revenue.</p><div class="bs"><a class="btn" href="#book">Book a strategy call</a><a class="btn o" href="#how">See how it works</a></div></div>${o}</div></div></header>`;
h+=S('lt c prob',`<h2>Your marketing problem <em>isn’t simple.</em></h2><p class="sub">You sell many solutions, to many industries, to many decision-makers, over long cycles. Generic marketing breaks.</p><div class="g g4" style="text-align:left">`+[['fun','Low-quality leads','Form fills that never become projects.'],['lay','Too many solutions','CCTV to BMS, each needs its own campaign.'],['bld','Many industries','Different needs. Different triggers.'],['clk','Long sales cycles','Leads become deals months later.'],['usr','Many decision-makers','IT, security, finance and procurement.'],['usd','High-value projects','Big deals need many touches.'],['link','Sales & marketing gap','Leads get lost between teams.'],['chart','No revenue proof','Which campaign made money? Unknown.']].map(x=>tile(...x)).join('')+`</div>`);
h+=S('lt c',`<h2>Built around <em>how you sell.</em></h2><p class="sub">Every campaign connects four things.</p><div class="pr rv">`+[['tgt','Target','Solution, industry, account and buyer.'],['mega','Attract','Intent, offer and campaign.'],['fun','Convert','Pages that qualify every enquiry.'],['chart','Close','Pipeline and revenue, tracked.']].map(([n,t,p])=>`<div><div class="ic">${I(n)}</div><h3>${t}</h3><p>${p}</p></div>`).join('')+`</div>`,'how');
h+=S('dk c',`<h2>One strategy. <em>Four channels.</em></h2><p class="sub">Chosen by where your buyer already is.</p><div class="g g4" style="text-align:left">`+[['srch','Google Ads','Catch buyers searching for CCTV, access control and networking.'],['usr','LinkedIn Ads','Reach the CIO, CISO, IT Director and Facility Manager.'],['mega','Meta Ads','Re-engage with case studies and remarketing.'],['chart','SEO','Own solution and problem searches long term.']].map(x=>tile(...x)).join('')+`</div>`);
h+=S('lt c',`<h2>Target the accounts <em>you want to win.</em></h2><p class="sub">Account-based marketing for named companies and their buying committees.</p><div class="ab rv">`+[['tgt','Identify','Pick target accounts'],['usr','Map','Find the buyers'],['mega','Engage','Reach them everywhere'],['lay','Educate','Case studies, guides'],['fun','Convert','Audits, demos, surveys'],['chart','Measure','Down to revenue']].map(([n,t,p])=>`<div><div class="ic">${I(n)}</div><b>${t}</b><span>${p}</span></div>`).join('')+`</div>`);
h+=S('dk c',`<h2>Replace “Contact Us” <em>with an offer.</em></h2><p class="sub">A named assessment gives buyers a reason to say yes.</p><div class="of rv"><div class="a"><small>BEFORE</small><span class="f">Contact Us</span><p>Only converts buyers who are already sold.</p></div><div class="b"><small>AFTER</small><span class="f">Free CCTV Site Assessment</span><p>Converts buyers who are still deciding.</p></div></div>${pills('Security System Audit|Access Control Assessment|Network Assessment|Cybersecurity Assessment|Cloud Readiness Assessment')}`);
const sg=a=>`<div class="sg">`+a.map(([n,t,p])=>`<div class="t rv"><div class="ic">${I(n)}</div><h3>${t}</h3><p>${p}</p></div>`).join('')+`</div>`;
h+=S('lt',`<div class="c"><h2>Every solution gets <em>its own campaign.</em></h2><p class="sub">Buyers search by problem, not by “security”. So we do too.</p></div><span class="tag" style="color:var(--or)">PHYSICAL SECURITY</span>`+sg([['cctv','CCTV & Surveillance','Security · Facilities'],['lock','Access Control','Security · HR · IT'],['eye','Perimeter Security','Risk & Compliance'],['fire','Fire & Life Safety','EHS · Compliance']])+`<span class="tag" style="color:var(--or)">IT BACKBONE</span>`+sg([['net','Networking','IT Manager'],['srv','Data Center','IT Director'],['shield','Cybersecurity','CISO'],['cloud','Cloud','CTO']])+`<span class="tag" style="color:var(--or)">WORKPLACES & SMART BUILDINGS</span>`+sg([['scr','Audio Visual','IT · Workplace'],['bld','BMS & Automation','Facilities Director'],['tel','Telecom & Cabling','Telecom Lead'],['cog','Managed Services','IT Director']]),'solutions');
h+=S('dk c',`<h2>Same solution. <em>Different message.</em></h2><p class="sub">A hospital buys CCTV for compliance. A retailer buys it to cut shrinkage.</p><div class="g g3" style="text-align:left">`+[['bag','Corporate','Cost efficiency & employee safety'],['plus','Healthcare','Patient safety & compliance'],['cap','Education','Campus safety & duty of care'],['cart','Retail','Shrinkage reduction & footfall insight'],['fac','Manufacturing','Asset protection & worker safety'],['bank','Banking & Government','Regulatory compliance & risk mitigation']].map(x=>tile(...x)).join('')+`</div>`);
h+=S('dk c',`<h2>Leads are <em>not the finish line.</em></h2><p class="sub">We track every campaign from first click to closed revenue.</p><div class="fz rv">`+['LEAD','MQL','SQL','OPPORTUNITY','PROPOSAL','PROJECT','REVENUE'].map((k,i)=>`<div style="width:${100-i*12}%">${k}</div>`).join('')+`</div><div class="ba rv" style="text-align:left"><div class="x"><small>FROM</small><span>“We generated 500 leads.”</span></div><div class="y"><small>TO</small>“This campaign generated 42 SQLs, 12 opportunities and $X in pipeline.”</div></div>`,'measure');
h+=S('dk',`<div class="ct"><div><h2>Ready to build a <em>better pipeline?</em></h2><p class="sub">Tell us what you sell. We’ll find where your growth system is leaking.</p>${pills('Channels|Targeting|Landing pages|Lead qualification|CRM & attribution|Revenue tracking')}<p class="em">Prefer email? <a href="mailto:hello@growthled.in">hello@growthled.in</a></p></div><form class="cf" id="cf" novalidate><label>Name<input name="name" required autocomplete="name"></label><label>Work email<input name="email" type="email" required autocomplete="email"></label><div class="r2"><label>Company<input name="company" autocomplete="organization"></label><label>Phone<input name="phone" type="tel" autocomplete="tel"></label></div><label>What do you sell most?<select name="sol">${['CCTV & Surveillance','Access Control','Perimeter & Fire Safety','Networking','Cybersecurity','Data Center & Cloud','Audio Visual','BMS & Smart Buildings','Telecom & Cabling','Managed Services','A mix of everything'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>How can we help?<textarea name="msg" rows="3"></textarea></label><button class="btn" type="submit">Book my strategy call</button><p class="ok" id="ok" hidden>Your email app should open with the details filled in. Just press send. If it doesn’t, write to hello@growthled.in.</p></form></div>`,'book');
document.getElementById('app').innerHTML=h;
document.getElementById('cf').addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(!f.reportValidity())return;const d=Object.fromEntries(new FormData(f));const body=`Name: ${d.name}\nEmail: ${d.email}\nCompany: ${d.company}\nPhone: ${d.phone}\nSells most: ${d.sol}\n\n${d.msg}`;const a=document.createElement('a');a.href='mailto:hello@growthled.in?subject='+encodeURIComponent('Strategy call request'+(d.company?' - '+d.company:''))+'&body='+encodeURIComponent(body);a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();document.getElementById('ok').hidden=false});
const io=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.12});
document.querySelectorAll('.rv').forEach(e=>io.observe(e));
</script></body></html>
